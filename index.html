<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Exams</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#121a2b;--mute:#5c667a;--line:#d9deea;--acc:#2f5bea;--onacc:#fff;--ok:#0f7a55;--okbg:#dff3ea;--bad:#b42318;--badbg:#fde7e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#18202f;--ink:#e8ecf5;--mute:#98a2b8;--line:#2b3548;--acc:#7b9bff;--onacc:#0f1420;--ok:#5fd3a4;--okbg:#12342a;--bad:#ff8f84;--badbg:#3b1d1a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--ink:#e8ecf5;--mute:#98a2b8;--line:#2b3548;--acc:#7b9bff;--onacc:#0f1420;--ok:#5fd3a4;--okbg:#12342a;--bad:#ff8f84;--badbg:#3b1d1a}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
#app{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:21px;line-height:1.35;margin:18px 0 14px}h3{margin:22px 0 8px}
.mute{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
button.ghost{border-color:transparent;background:none;color:var(--mute)}
button:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px}
.opt.pick{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);opacity:1}.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:1}
.fb{font-weight:700;margin:10px 0}.g{color:var(--ok)}.r{color:var(--bad)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font-size:13px}
#msg{color:var(--bad);margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const BUILTIN=[Object.assign({id:'qc'},{"title": "Quality Control", "questions": [{"q": "Helps organize ideas and show the relationship between potential causes and an effect or problem.", "choices": ["Scatter Diagram", "Histogram", "Cause and Effect Diagram", "Control Chart"], "answer": 2}, {"q": "Used to prioritize the contributors that make the biggest impact on a problem.", "choices": ["Flow Chart", "Check Sheet", "Histogram", "Pareto Chart"], "answer": 3}, {"q": "Investigates the variation in a process. A time series plot used to monitor a process over time.", "choices": ["Scatter Diagram", "Control Chart", "Pareto Chart", "Histogram"], "answer": 1}, {"q": "Also known as a scatter plot or correlation graph; it visualizes the relationship between two variables.", "choices": ["Check Sheet", "Flow Chart", "Scatter Diagram", "Histogram"], "answer": 2}, {"q": "Pictorial representation of a set of data. A bar graph that shows the frequency of values.", "choices": ["Control Chart", "Histogram", "Pareto Chart", "Cause and Effect Diagram"], "answer": 1}, {"q": "A visual representation of a process that shows activities, hand-offs, and operational boundaries.", "choices": ["Scatter Diagram", "Pareto Chart", "Flow Chart", "Check Sheet"], "answer": 2}, {"q": "Used to summarize and graphically depict a tally count of event occurrences.", "choices": ["Histogram", "Flow Chart", "Control Chart", "Check Sheet"], "answer": 3}, {"q": "Another name for the Fishbone Diagram.", "choices": ["Gantt Diagram", "Ishikawa Diagram", "Deming Diagram", "Pareto Diagram"], "answer": 1}, {"q": "The system of all means to economically create quality products that meet consumer needs.", "choices": ["Quality Assurance", "Quality Sales", "Quality Design", "Quality Control"], "answer": 3}, {"q": "The management thinker who defined quality control as the system of all means to economically create quality products that meet the needs of the consumer.", "choices": ["Walter Shewhart", "William Edward Deming", "Kaoru Ishikawa", "Vilfredo Pareto"], "answer": 1}, {"q": "The step that decides what to make and how to make it, and where quality, technical, work, and inspection standards are written.", "choices": ["Investigate", "Manufacture", "Sales", "Design"], "answer": 3}, {"q": "The step of making the product according to the method decided at the design stage, including necessary tests.", "choices": ["Re-design", "Sales", "Manufacture", "Design"], "answer": 2}, {"q": "The step of selling the product to the market, including giving customers knowledge of the product.", "choices": ["Investigate", "Manufacture", "Sales", "Design"], "answer": 2}, {"q": "The stage that investigates whether the selling products are getting a response from the market and whether the quality meets the needs of the customer.", "choices": ["Re-design", "Design", "Manufacture", "Investigate"], "answer": 3}, {"q": "The step that determines what needs to be improved by observing customer response.", "choices": ["Re-design", "Sales", "Investigate", "Design"], "answer": 0}, {"q": "This is not only done at the end of the manufacturing process. It is also important to evaluate whether the quality is appropriate at the time when the quality design is completed.", "choices": ["Quality Evaluation", "Quality Assurance", "Quality Manufacturing", "Quality Sales"], "answer": 0}, {"q": "However, product seems to trading something has shape, but actually, it is selling of quality. It is selling the quality of the product.", "choices": ["Quality Evaluation", "Quality Sales", "Quality Design", "Quality Investigation"], "answer": 1}, {"q": "Production of quality objects by carrying out work according to the work standards specified in the design stage.", "choices": ["Quality Sales", "Quality Manufacturing", "Quality Assurance", "Quality Design"], "answer": 1}, {"q": "Guaranteeing the quality of a product to customers, like “I promise and excite our product.”", "choices": ["Quality Design", "Quality Evaluation", "Quality Investigation", "Quality Assurance"], "answer": 3}, {"q": "Investigating demand quality and realization quality.", "choices": ["Quality Investigation", "Quality Sales", "Quality Design", "Quality Manufacturing"], "answer": 0}, {"q": "Determining what kind of “function” a product is to be made with, and the factors and methods for implementing such properties.", "choices": ["Quality Evaluation", "Quality Design", "Quality Manufacturing", "Quality Assurance"], "answer": 1}, {"q": "The PDCA step that clarifies the purpose, sets the target, decides the method, and distributes tasks.", "choices": ["Act", "Do", "Check", "Plan"], "answer": 3}, {"q": "The PDCA step that motivates, educates and trains, executes the operation, and collects result data.", "choices": ["Act", "Do", "Plan", "Check"], "answer": 1}, {"q": "The PDCA step that investigates on whether the operation was done accordingly to the criteria.", "choices": ["Act", "Check", "Plan", "Do"], "answer": 1}, {"q": "The PDCA step that investigates on whether the performance has been properly accomplished.", "choices": ["Act", "Plan", "Do", "Check"], "answer": 3}, {"q": "The PDCA step that modifies treatments, investigates causes of abnormal results, and revises principles and methods of work.", "choices": ["Act", "Do", "Check", "Plan"], "answer": 0}, {"q": "The cycle of Plan, Do, Check, Act that represents continuous improvement.", "choices": ["Quality Evaluation", "Pareto Chart", "Flow Chart", "PDCA"], "answer": 3}]})];
BUILTIN.push(Object.assign({id:'tpm'},{"title": "TPM (Total Productive Maintenance)", "questions": [{"q": "A maintenance approach that involves everyone and utilizes cross-functional teamwork.", "choices": ["Total Productive Maintenance (TPM)", "Preventive Maintenance", "Total Quality Management", "Breakdown Maintenance"], "answer": 0}, {"q": "Equipment classification that includes fasteners, shaft and shaft joints, seal components, bearings, valve gauges and piping.", "choices": ["Driving Device", "Mechanical Elements", "Lubrication Device", "Pneumatic Device"], "answer": 1}, {"q": "Equipment classification that includes electric motor, belt, chain, gear transmission, and brake.", "choices": ["Driving Device", "Pneumatic Device", "Hydraulic Device", "Mechanical Elements"], "answer": 0}, {"q": "Equipment classification that includes proper oil availability, lubrication points and their maintenance status, and lubrication piping.", "choices": ["Driving Device", "Mechanical Elements", "Lubrication Device", "Hydraulic Device"], "answer": 2}, {"q": "Equipment classification that includes the air 3-point set, valves, and actuators.", "choices": ["Hydraulic Device", "Driving Device", "Pneumatic Device", "Lubrication Device"], "answer": 2}, {"q": "Equipment classification that includes hydraulic tanks, valves, and actuators.", "choices": ["Mechanical Elements", "Pneumatic Device", "Lubrication Device", "Hydraulic Device"], "answer": 3}, {"q": "Equipment classification that includes motor, cable and terminal status, control box, sensor, wiring, and S/W.", "choices": ["Driving Device", "Electric and Instrumentation Equipment", "Pneumatic Device", "Mechanical Elements"], "answer": 1}, {"q": "Which set lists all the systematic classifications of equipment?", "choices": ["Mechanical elements, driving device, lubrication device, pneumatic device, hydraulic device, safety equipment", "Driving device, lubrication device, pneumatic device, hydraulic device, electric and instrumentation equipment", "Mechanical elements, driving device, cooling device, pneumatic device, hydraulic device, electric and instrumentation equipment", "Mechanical elements, driving device, lubrication device, pneumatic device, hydraulic device, electric and instrumentation equipment"], "answer": 3}, {"q": "Excluding loss and devising improvement in the performance of the machine, process, and plant itself to maximize the effect.", "choices": ["Self Maintenance", "Planned Maintenance", "Office Support", "Individual Improvement"], "answer": 3}, {"q": "The six losses in TPM.", "choices": ["Breakdown, work preparation, sudden stoppage, speed loss, process defect, machine painting", "Breakdown, work preparation, sudden stoppage, speed loss, process defect, initial yield", "Breakdown, late delivery, sudden stoppage, speed loss, process defect, initial yield", "Breakdown, work preparation, sudden stoppage, overtime, process defect, initial yield"], "answer": 1}, {"q": "Which of these is one of the 6 losses?", "choices": ["Sudden Stoppage", "Late Delivery", "Overtime", "Machine Painting"], "answer": 0}, {"q": "Setting of basic condition, finding degraded parts, and keeping the condition based on inspection.", "choices": ["Quality Preservation", "Self Maintenance", "Initial Management", "Planned Maintenance"], "answer": 1}, {"q": "Minimizes the occurred loss by making zero machine breakdown and process trouble.", "choices": ["Safety Environment", "Planned Maintenance", "Self Maintenance", "Individual Improvement"], "answer": 1}, {"q": "Includes managing the product and the equipment: equipment investment planning, process design, equipment design, fabrication, construction, trial run, and initial flow management.", "choices": ["Office Support", "Quality Preservation", "Planned Maintenance", "Initial Management"], "answer": 3}, {"q": "The four factors that mainly influence quality characteristics.", "choices": ["Man, Machine, Money, Method", "Man, Machine, Material, Method", "Man, Machine, Material, Maintenance", "Man, Market, Material, Method"], "answer": 1}, {"q": "The department that is an office factory taking charge of collecting, processing, and supplying information.", "choices": ["Individual Improvement", "Office Support", "Safety Environment", "Initial Management"], "answer": 1}, {"q": "Assuring safety and preventing adverse environmental impacts, which are important priorities in any TPM effort.", "choices": ["Quality Preservation", "Self Maintenance", "Safety Environment", "Office Support"], "answer": 2}, {"q": "Activity of preventing quality defects in process and equipment.", "choices": ["Planned Maintenance", "Initial Management", "Safety Environment", "Quality Preservation"], "answer": 3}, {"q": "The activity that forms the basis of the TPM (Global Production and Preservation) movement.", "choices": ["PDCA", "5S", "4M", "6 Losses"], "answer": 1}, {"q": "The five S's of the 5S activity.", "choices": ["Sort, Systematize, Sweep, Safety, Sustain", "Sort, Simplify, Sweep, Standardize, Sustain", "Sort, Systematize, Sweep, Standardize, Supervise", "Sort, Systematize, Sweep, Standardize, Sustain"], "answer": 3}, {"q": "Remove what is not needed and keep what is needed.", "choices": ["Sustain (Habituation)", "Sweep (Cleaning)", "Sort", "Systematize (Arranging)"], "answer": 2}, {"q": "Once the unneeded items are cleared out, straighten up what is left.", "choices": ["Systematize (Arranging)", "Sweep (Cleaning)", "Sort", "Sustain (Habituation)"], "answer": 0}, {"q": "Keeping everything swept and clean so problems like leaks, damage, spills, and excess can be easily identified; it also means preventive maintenance.", "choices": ["Sort", "Standardize (Cleanliness)", "Sweep (Cleaning)", "Systematize (Arranging)"], "answer": 2}, {"q": "Applied when the first three S's are properly maintained; establishes standards and guidelines to maintain a clean workplace.", "choices": ["Sustain (Habituation)", "Standardize (Cleanliness)", "Sort", "Sweep (Cleaning)"], "answer": 1}, {"q": "Establishing and maintaining responsibilities, requiring leader commitment so everyone sticks to the rules and makes it a habit.", "choices": ["Standardize (Cleanliness)", "Sustain (Habituation)", "Systematize (Arranging)", "Sort"], "answer": 1}, {"q": "Which of the following are TPM zero goals?", "choices": ["Disaster Zero", "Failure Zero", "Defective Zero", "All of the above"], "answer": 3}, {"q": "Which of these is a component of Mechanical Elements?", "choices": ["Gear transmission", "Air 3-point set", "Bearings", "Control box"], "answer": 2}, {"q": "Which of these is a component of a Driving Device?", "choices": ["Hydraulic tanks", "Gear transmission", "Control box", "Bearings"], "answer": 1}, {"q": "Which of these is a component of a Lubrication Device?", "choices": ["Sensor", "Belt", "Actuators", "Lubrication piping"], "answer": 3}, {"q": "Which of these is a component of a Pneumatic Device?", "choices": ["Brake", "Sensor", "Air 3-point set", "Lubrication piping"], "answer": 2}, {"q": "Which of these is a component of a Hydraulic Device?", "choices": ["Chain", "Hydraulic tanks", "Wiring", "Seal components"], "answer": 1}, {"q": "Which of these is a component of Electric and Instrumentation Equipment?", "choices": ["Wiring", "Hydraulic tanks", "Seal components", "Chain"], "answer": 0}]}));
const $=s=>document.querySelector(s),app=$('#app'),L='ABCDEFGH';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const getImp=()=>rd('imp')||[];
const all=()=>[...BUILTIN,...getImp().map((e,i)=>({...e,id:'i'+i,imported:1}))];
const rmGet=t=>(rd('rm')||{})[t]||[];
const rmSet=(t,a)=>{const m=rd('rm')||{};m[t]=a;wr('rm',m)};
const live=e=>e.questions.filter(q=>!rmGet(e.title).includes(q.q));
let S=null;
function home(){const b=rd('best')||{};
app.innerHTML='<h1>Study Exams</h1><p class="mute">Pick an exam, then practice it or take it as a test.</p>'+
all().map(e=>`<div class="card"><b>${esc(e.title)}</b><div class="mute">${live(e).length} questions${live(e).length<e.questions.length?' ('+(e.questions.length-live(e).length)+' removed)':''}${b[e.id]!=null?', best exam score '+b[e.id]+'%':''}</div><div class="row"><button class="pri" onclick="start('${e.id}','p')">Practice</button><button onclick="start('${e.id}','e')">Exam</button><button onclick="manage('${e.id}')">Questions</button>${e.imported?`<button class="ghost" onclick="del('${e.id}')">Delete</button>`:''}</div></div>`).join('')+
`<div class="card"><b>Add another exam</b><div class="mute">Each exam is its own .json file. Import one to add it to this list.</div><input id="f" type="file" accept=".json,application/json" hidden><div class="row"><button onclick="$('#f').click()">Import exam file</button></div><div id="msg"></div><details><summary class="mute">File format</summary><pre>{ "title": "My Exam",\n  "questions": [\n    { "q": "Question text",\n      "choices": ["A","B","C","D"],\n      "answer": 0 }\n  ] }</pre><p class="mute">"answer" is the position of the correct choice, starting at 0. Imported exams stay on this device.</p></details></div>`;
$('#f').onchange=importFile}
function importFile(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.title||!Array.isArray(d.questions)||!d.questions.length)throw 0;d.questions.forEach(q=>{if(!q.q||!Array.isArray(q.choices)||q.choices.length<2||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.choices.length)throw 0});wr('imp',[...getImp(),{title:d.title,questions:d.questions}]);home()}catch(e){$('#msg').textContent='That file could not be read. Check it matches the format below.'}};r.readAsText(f)}
function del(id){const i=+id.slice(1);wr('imp',getImp().filter((_,j)=>j!==i));home()}
function start(id,m,only){const e=all().find(x=>x.id===id);S={id,t:e.title,m,i:0,sel:[],qs:sh(only||live(e)).map(q=>{const k=q.choices.findIndex(c=>/^(all|none) of the above/i.test(c)),ix=q.choices.map((_,i)=>i),o=k<0?sh(ix):[...sh(ix.filter(i=>i!==k)),k];return{q:q.q,c:o.map(i=>q.choices[i]),a:o.indexOf(q.answer),raw:q}})};quiz()}
function quiz(){const q=S.qs[S.i],n=S.qs.length,sel=S.sel[S.i],show=S.m==='p'&&sel!=null;
app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">Exit</button><span class="mute">${S.i+1} of ${n} (${S.m==='e'?'Exam':'Practice'})</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div><h2>${esc(q.q)}</h2>`+
q.c.map((c,i)=>{let k='opt';if(show){if(i===q.a)k+=' ok';else if(i===sel)k+=' bad'}else if(i===sel)k+=' pick';return `<button class="${k}" onclick="pick(${i})" ${show?'disabled':''}><b>${L[i]}.</b> ${esc(c)}</button>`}).join('')+
(show?`<p class="fb ${sel===q.a?'g':'r'}">${sel===q.a?'Correct':'The answer is '+L[q.a]+'. '+esc(q.c[q.a])}</p>`:'')+
`<div class="row"><button class="pri" onclick="next()" ${sel==null?'disabled':''}>${S.i===n-1?'Finish':'Next'}</button><button class="ghost" onclick="rmQ()">Remove question</button></div>`}
function pick(i){if(S.m==='p'&&S.sel[S.i]!=null)return;S.sel[S.i]=i;quiz()}
function next(){S.i<S.qs.length-1?(S.i++,quiz()):result()}
function result(){const w=[];S.qs.forEach((q,i)=>{if(S.sel[i]!==q.a)w.push({...q,s:S.sel[i]})});const n=S.qs.length,p=Math.round((n-w.length)/n*100);
if(S.m==='e'){const b=rd('best')||{};b[S.id]=Math.max(b[S.id]||0,p);wr('best',b)}
app.innerHTML=`<h1>${p}%</h1><p>${n-w.length} of ${n} correct</p><div class="row">${w.length?`<button class="pri" onclick="redo()">Practice ${w.length} missed</button>`:''}<button onclick="start('${S.id}','${S.m}')">Try again</button><button class="ghost" onclick="home()">Home</button></div>`+
(w.length?'<h3>Missed questions</h3>':'<p>Perfect score.</p>')+
w.map(q=>`<div class="card">${esc(q.q)}<div class="fb r">You chose: ${esc(q.c[q.s])}</div><div class="fb g">Answer: ${esc(q.c[q.a])}</div></div>`).join('')}
function redo(){start(S.id,'p',S.qs.filter((q,i)=>S.sel[i]!==q.a).map(q=>q.raw))}
function rmQ(){const q=S.qs[S.i];rmSet(S.t,[...rmGet(S.t),q.raw.q]);S.qs.splice(S.i,1);S.sel.splice(S.i,1);if(!S.qs.length)return home();S.i>=S.qs.length?result():quiz()}
function manage(id){const e=all().find(x=>x.id===id),r=rmGet(e.title);
app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">Back</button><button class="ghost" onclick="rall('${id}')">Restore all</button></div><h1>${esc(e.title)}</h1><p class="mute">Removed questions are skipped in Practice and Exam. They are hidden on this device only.</p>`+
e.questions.map((q,i)=>`<div class="card" ${r.includes(q.q)?'style="opacity:.55"':''}>${i+1}. ${esc(q.q)}<div class="mute">Answer: ${esc(q.choices[q.answer])}</div><div class="row"><button onclick="tog('${id}',${i})">${r.includes(q.q)?'Restore':'Remove'}</button></div></div>`).join('')}
function tog(id,i){const e=all().find(x=>x.id===id),t=e.questions[i].q,r=rmGet(e.title);rmSet(e.title,r.includes(t)?r.filter(x=>x!==t):[...r,t]);manage(id)}
function rall(id){rmSet(all().find(x=>x.id===id).title,[]);manage(id)}
home();
</script></body></html>
